<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>터틀넥 · 연습 시험</title><link rel="stylesheet" href="/exam.css"><script src="/exam.js" defer></script></head>
<body>
<header><a href="#"><img src="/icon.png" alt="">터틀넥 <span>나만의 시험실</span></a><span id="phase">시험지 준비 중</span></header>
<main><section class="intro"><p class="eyebrow">수업자료 기반 연습 시험</p><h1 id="title">시험지를 가져오고 있어요</h1><p>차근차근 풀어보세요. 답안은 이 컴퓨터에 저장돼요.</p><div class="meta"><span id="total"></span><span id="progress"></span><span id="saved" role="status" aria-live="polite"></span></div></section>

<div class="layout"><form id="paper"><div id="questions"></div><footer><p>제출 후에는 답안을 수정할 수 없어요.</p><button id="submit" type="submit">답안 제출하기</button></footer></form><aside><h2>문항 이동</h2><nav id="nav" aria-label="문항 이동"></nav><p>표시가 채워진 번호는 답안을 입력한 문항이에요.</p><p>실제 학교 시험이나 예상 기출이 아닌, 읽은 수업자료 기반 연습이에요.</p></aside></div>
<section id="results" hidden></section></main>
